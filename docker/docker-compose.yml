services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    # Removed network_mode: host
    stdin_open: true
    tty: true
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0  # Must be 0.0.0.0 for port mapping to work properly[cite: 1]
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_INSECURE=1    # Traefik handles TLS and upstream routing[cite: 1]
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - /home/mike/.hermes:/opt/data  # Bind-mounts host config to the container data path[cite: 2]
    ports:
      - "127.0.0.1:9119:9119"  # Allows your Traefik instance to route here locally[cite: 1]
    networks:
      - traefik-net

  proton-bridge:
    image: ghcr.io/videocurio/proton-mail-bridge:latest
    container_name: proton-bridge
    restart: unless-stopped
    volumes:
      - /home/mike/.hermes/proton-mail-bridge-data:/root
    networks:
      - traefik-net

# Ensure the shared network is declared
networks:
  traefik-net:
    external: true
